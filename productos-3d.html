<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo 3D Personalizado - RentComp</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f4f4; }
        
        header {
            background-color: #3f51b5; color: white; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .catalogo-container {
            padding: 40px 5%; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; max-width: 1200px; margin: 0 auto;
        }

        .producto-card {
            background: white; border-radius: 8px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }

        .card-header {
            background-color: #383838; color: white; padding: 12px;
            text-align: center; font-weight: bold; text-transform: uppercase;
        }

        .card-img { height: 200px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .card-img img { max-width: 90%; max-height: 90%; object-fit: contain; transition: 0.3s; }

        .card-details { padding: 15px; border-top: 1px solid #eee; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
        .detail-label { font-weight: bold; color: #555; }

        /* Colores */
        .color-dots { display: flex; gap: 6px; flex-wrap: wrap; max-width: 150px; justify-content: flex-end; }
        .dot {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ddd;
            cursor: pointer; transition: 0.2s;
        }
        .dot:hover { transform: scale(1.2); border-color: #333; }
        .dot.selected { border-color: #3f51b5; transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.3); }

        .btn-pedido {
            display: block; text-align: center; background-color: #25d366;
            color: white; text-decoration: none; padding: 12px;
            margin: 15px; border-radius: 5px; font-weight: bold; transition: 0.3s;
        }
        .btn-pedido:hover { background-color: #1ebe57; transform: translateY(-2px); }

        /* Colores */
        .c-blanco { background: #fff; } .c-azul { background: #4a90e2; }
        .c-negro { background: #000; } .c-verde { background: #00ff2b; }
        .c-violeta { background: #9013fe; } .c-rojo { background: #d0021b; }
        .c-amarillo { background: #f8e71c; } .c-naranja { background: #f5a623; }
        .c-rosa { background: #ffc0cb; }
    </style>
</head>
<body>

<header>
    <div class="logo"><h1>RentComp 3D</h1></div>
    <nav><a href="index.html" style="color:white; text-decoration:none;">Volver al Inicio</a></nav>
</header>

<div class="catalogo-container" id="catalogo">
    </div>

<script>
    const productos = [
        { id: 1, nombre: "Mate Personalizado", img: "Imagen/mate.jpg", material: "PLA / PETG" },
        { id: 2, nombre: "Funko Pop Custom", img: "Imagen/funko.jpg", material: "Resina / PLA" },
        { id: 3, nombre: "Llavero Pesca", img: "Imagen/pesca.jpg", material: "PLA+" },
        { id: 4, nombre: "Casco Llavero", img: "Imagen/casco.jpg", material: "PLA" },
        { id: 5, nombre: "Dragón Flexi", img: "Imagen/dragon.jpg", material: "PLA Silk" },
        { id: 6, nombre: "Kuromi 3D", img: "Imagen/kuromi.jpg", material: "PLA / Pintado" }
    ];

    const colores = [
        { nombre: "Blanco", clase: "c-blanco" },
        { nombre: "Azul", clase: "c-azul" },
        { nombre: "Negro", clase: "c-negro" },
        { nombre: "Verde", clase: "c-verde" },
        { nombre: "Violeta", clase: "c-violeta" },
        { nombre: "Rojo", clase: "c-rojo" },
        { nombre: "Amarillo", clase: "c-amarillo" },
        { nombre: "Naranja", clase: "c-naranja" },
        { nombre: "Rosa", clase: "c-rosa" }
    ];

    const container = document.getElementById('catalogo');

    productos.forEach(p => {
        let selectedColor = "Original";
        
        const card = document.createElement('div');
        card.className = 'producto-card';
        card.innerHTML = `
            <div class="card-header">${p.nombre}</div>
            <div class="card-img"><img src="${p.img}" id="img-${p.id}" alt="${p.nombre}"></div>
            <div class="card-details">
                <div class="detail-row"><span class="detail-label">Modelo</span><span id="mod-${p.id}">${p.nombre}</span></div>
                <div class="detail-row"><span class="detail-label">Material</span><span>${p.material}</span></div>
                <div class="detail-row" style="border:none">
                    <span class="detail-label">Color: <small id="txt-color-${p.id}" style="color:#3f51b5">Elegí uno</small></span>
                    <div class="color-dots" id="colors-${p.id}"></div>
                </div>
            </div>
            <a href="#" id="wsp-${p.id}" class="btn-pedido" target="_blank">Pedir en WhatsApp</a>
        `;
        container.appendChild(card);

        // Generar puntitos de colores
        const colorDiv = document.getElementById(`colors-${p.id}`);
        colores.forEach(c => {
            const dot = document.createElement('div');
            dot.className = `dot ${c.clase}`;
            dot.onclick = () => {
                // Quitar selección previa
                document.querySelectorAll(`#colors-${p.id} .dot`).forEach(d => d.classList.remove('selected'));
                dot.classList.add('selected');
                
                // Actualizar texto y link
                document.getElementById(`txt-color-${p.id}`).innerText = c.nombre;
                updateWspLink(p.id, p.nombre, c.nombre);
            };
            colorDiv.appendChild(dot);
        });

        // Link inicial
        updateWspLink(p.id, p.nombre, "a elección");
    });

    function updateWspLink(id, producto, color) {
        const mensaje = encodeURIComponent(`Hola Rentcomp, quiero un ${producto} de color ${color}`);
        document.getElementById(`wsp-${id}`).href = `https://wa.me/541122956069?text=${mensaje}`;
    }
</script>

</body>
</html>
